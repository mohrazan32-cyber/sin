<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>الاختبار الشامل في العلوم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: sticky exam bar on top; question card on the right, question map on the left (stacks below on phones). */
:root{
  --bg:#eef3f3; --surface:#ffffff; --fg:#14292b; --muted:#566b6d; --line:#cfdcdc;
  --accent:#0b6b6b; --accent-fg:#ffffff; --accent-soft:#d9eeee;
  --flag:#a9650b; --flag-soft:#fbe9cd;
  --ok:#2a7a4b; --ok-soft:#d8f0e0; --bad:#b03a2c; --bad-soft:#f8dcd7;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-display:'Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --shadow:0 1px 2px rgba(20,41,43,.06),0 6px 20px rgba(20,41,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1b1c; --surface:#152628; --fg:#e4efef; --muted:#9bb2b3; --line:#2b4143;
  --accent:#4fc2c2; --accent-fg:#06201f; --accent-soft:#17393a;
  --flag:#e3a64f; --flag-soft:#3a2d14;
  --ok:#5cc489; --ok-soft:#163626; --bad:#ef8a7b; --bad-soft:#3d1d19;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1b1c; --surface:#152628; --fg:#e4efef; --muted:#9bb2b3; --line:#2b4143;
  --accent:#4fc2c2; --accent-fg:#06201f; --accent-soft:#17393a;
  --flag:#e3a64f; --flag-soft:#3a2d14;
  --ok:#5cc489; --ok-soft:#163626; --bad:#ef8a7b; --bad-soft:#3d1d19;
  --shadow:none; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.7;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto}
bdi,[dir=ltr]{unicode-bidi:isolate}
sub,sup{line-height:0}
.iso{display:inline-flex;flex-direction:column;font-size:.62em;line-height:1.05;text-align:end;vertical-align:middle;margin-inline-start:.1em}
.iso span{display:block}

/* ---------- start screen ---------- */
.start{max-width:640px;margin:0 auto;padding-top:clamp(24px,7vh,72px)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.sheet-head{padding:22px 24px 18px;border-bottom:3px double var(--line);text-align:center}
.ministry{color:var(--muted);font-size:.95rem;letter-spacing:.02em}
.sheet-head h1{font-size:clamp(1.5rem,5vw,2rem);margin-top:6px;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.facts div{padding:14px 10px;text-align:center;border-inline-end:1px solid var(--line)}
.facts div:last-child{border-inline-end:0}
.facts b{display:block;font-family:var(--font-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.facts span{color:var(--muted);font-size:.85rem}
.form{padding:22px 24px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:500}
.field input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-bottom:2px solid var(--muted);border-radius:4px;padding:10px 12px;width:100%}
.rules{margin:0;padding:0 20px 0 0;color:var(--muted);font-size:.92rem}
.rules li{margin-block:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:9px 18px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{padding:12px 22px;font-size:1.05rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}

/* ---------- exam bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));}
.bar-in{max-width:1080px;margin-inline:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar-title{font-family:var(--font-display);font-weight:600;font-size:.95rem;flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-family:var(--font-display);font-weight:700;font-size:1.25rem;direction:ltr;padding:2px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:5.6em;text-align:center}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.prog{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:4px;background:var(--line);position:absolute;inset:auto 0 0 0}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.bar{position:sticky}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:8px 14px;margin-top:14px;font-weight:500}

/* ---------- exam body ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;margin-top:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.q-no{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:1.05rem}
.q-no small{color:var(--muted);font-weight:400;font-family:var(--font-body)}
.flagbtn{border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 12px;font-size:.88rem;color:var(--muted)}
.flagbtn[aria-pressed=true]{background:var(--flag-soft);border-color:var(--flag);color:var(--flag);font-weight:600}
.q-body{padding:18px 20px 8px}
.q-text{font-size:1.1rem;line-height:1.95;margin:0}
.fig{margin:16px 0 4px;text-align:center}
.fig img{display:block;margin-inline:auto;border:1px solid var(--line);border-radius:4px;background:#fff;height:auto;max-width:100%}
.fig figcaption{color:var(--muted);font-size:.88rem;margin-top:6px}
.tbl{overflow-x:auto;margin:16px 0 4px}
.tbl table{border-collapse:collapse;margin-inline:auto;min-width:min(100%,380px)}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 14px;text-align:center;font-variant-numeric:tabular-nums}
.tbl th{background:var(--accent-soft);font-weight:600}
.opts{display:grid;gap:10px;padding:14px 20px 18px;margin:0;list-style:none}
.opts.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:10px 14px;min-height:50px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ltr{flex:0 0 34px;height:34px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--muted)}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .txt img{max-width:100%;height:auto;display:block;border-radius:3px;background:#fff}
.opt[aria-checked=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked=true] .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .tag{font-size:.8rem;font-weight:600;white-space:nowrap}
.opt.ok .tag{color:var(--ok)} .opt.bad .tag{color:var(--bad)}
.q-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line)}
.q-foot .grp{display:flex;gap:10px}
.clear{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 6px;font-size:.9rem}
.verdict{margin:0 20px 16px;padding:8px 12px;border-radius:4px;font-weight:500;font-size:.95rem}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)} .verdict.skip{background:var(--flag-soft);color:var(--flag)}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);padding:16px}
.side h2{font-size:1rem;margin-bottom:10px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.map button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:5px;background:var(--bg);font-variant-numeric:tabular-nums;font-weight:500;position:relative;padding:0}
.map button.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.map button.flg::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:9px;height:9px;border-radius:50%;background:var(--flag);border:1.5px solid var(--surface)}
.map button.cur{outline:3px solid var(--fg);outline-offset:1px}
.map button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.map button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.map button.skip{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.legend{display:grid;gap:4px;margin:14px 0;font-size:.85rem;color:var(--muted)}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);background:var(--bg);flex:none}
.legend i.a{background:var(--accent);border-color:var(--accent)}
.legend i.f{background:var(--flag);border-color:var(--flag);border-radius:50%}
.legend i.o{background:var(--ok);border-color:var(--ok)} .legend i.b{background:var(--bad);border-color:var(--bad)} .legend i.s{background:var(--flag-soft);border-color:var(--flag)}
.side .btn{width:100%}

/* ---------- modal & result ---------- */
.veil{position:fixed;inset:0;background:rgba(8,20,21,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:440px;width:100%;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.modal h2{font-size:1.2rem}
.modal ul{margin:0;padding:0 18px 0 0}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.result{max-width:640px;margin:0 auto;padding-top:clamp(20px,6vh,56px)}
.score{padding:28px 24px;text-align:center;display:grid;gap:6px}
.score .big{font-family:var(--font-display);font-weight:700;font-size:clamp(3rem,14vw,4.6rem);line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums;direction:ltr}
.score .big small{font-size:.4em;color:var(--muted);font-weight:600}
.score .grade{font-family:var(--font-display);font-size:1.25rem}
.split{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.split div{padding:14px 8px;text-align:center;border-inline-end:1px solid var(--line)}
.split div:last-child{border-inline-end:0}
.split b{display:block;font-size:1.3rem;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.split span{font-size:.85rem;color:var(--muted)}
.split .g b{color:var(--ok)} .split .r b{color:var(--bad)} .split .y b{color:var(--flag)}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:18px 24px 24px;border-top:1px solid var(--line)}
.who{color:var(--muted)}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .map{grid-template-columns:repeat(8,1fr)}
  .opts.grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){.map{grid-template-columns:repeat(5,1fr)} .q-body,.opts,.q-foot,.q-head{padding-inline:14px} .verdict{margin-inline:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const KEY = 'science-exam-2026-v1';
const SECONDS = 7200;
const LET = ['أ','ب','ج','د'];
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const $app = document.getElementById('app');

let S = { phase:'start', name:'', sec:'', startAt:0, endAt:0, answers:{}, flags:{}, cur:0, submittedAt:0 };
let tick = null;

function load(){ try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); if(o && o.phase) S = Object.assign(S,o); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const fmt = s => { s=Math.max(0,s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return [h,m,x].map(v=>String(v).padStart(2,'0')).join(':'); };
const answered = () => Object.keys(S.answers).length;
const score = () => Q.reduce((t,q,i)=> t + (S.answers[i]===q.a ? 1 : 0), 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- start ---------- */
function renderStart(){
  const resume = S.phase==='exam';
  $app.innerHTML = `
  <section class="start">
    <div class="sheet">
      <div class="sheet-head">
        <div class="ministry">وزارة التربية والتعليم · بسم الله الرحمن الرحيم</div>
        <h1>اختبار العلوم والفيزياء المتكامل</h1>
      </div>
      <div class="facts">
        <div><b>${ar(40)}</b><span>سؤالاً</span></div>
        <div><b>ساعتان</b><span>مدة الامتحان</span></div>
        <div><b>${ar(40)}</b><span>الدرجة الكلية</span></div>
      </div>
      <form class="form" id="startForm" autocomplete="off">
        <div class="field"><label for="nm">اسم الطالب</label><input id="nm" value="${esc(S.name)}" required></div>
        <div class="field"><label for="sc">الشعبة</label><input id="sc" value="${esc(S.sec)}"></div>
        <ul class="rules">
          <li>جميع الأسئلة اختيار من متعدد، والإجابة الصحيحة واحدة فقط، ولكل سؤال درجة واحدة.</li>
          <li>يمكنك التنقل بين الأسئلة وتغيير إجاباتك وتعليم الأسئلة التي تريد العودة إليها.</li>
          <li>تحفظ إجاباتك تلقائياً، وينتهي الامتحان ويسلّم تلقائياً عند انتهاء الوقت.</li>
        </ul>
        <div class="err" id="err"></div>
        <button class="btn primary big" type="submit">ابدأ الامتحان</button>
      </form>
    </div>
  </section>`;
  document.getElementById('startForm').addEventListener('submit', e=>{
    e.preventDefault();
    const nm = document.getElementById('nm').value.trim();
    if(!nm){ document.getElementById('err').textContent='اكتب اسمك قبل أن تبدأ.'; return; }
    S = { phase:'exam', name:nm, sec:document.getElementById('sc').value.trim(), startAt:Date.now(), endAt:Date.now()+SECONDS*1000, answers:{}, flags:{}, cur:0, submittedAt:0 };
    save(); renderExam(); startTick();
  });
}

/* ---------- exam / review ---------- */
function figHTML(q){
  let h='';
  (q.f||[]).forEach(k=>{
    const im = IMG[k];
    h += `<figure class="fig"><img src="${im.src}" alt="شكل السؤال" style="width:min(100%,${im.w}px)">${q.cap?`<figcaption>${q.cap}</figcaption>`:''}</figure>`;
  });
  return h + (q.x||'');
}
function optsHTML(q,i,review){
  const imgOpts = !!q.img_opts;
  const n = imgOpts ? q.img_opts.length : q.o.length;
  let h = `<div class="opts ${imgOpts?'grid2':''}" role="${review?'list':'radiogroup'}" aria-label="الخيارات">`;
  for(let k=0;k<n;k++){
    const body = imgOpts ? `<img src="${IMG[q.img_opts[k]].src}" alt="الخيار ${LET[k]}">` : q.o[k];
    let cls='opt', tag='';
    if(review){
      if(k===q.a){cls+=' ok'; tag = S.answers[i]===k ? '<span class="tag">إجابتك ✓</span>' : '<span class="tag">الصحيحة</span>';}
      else if(S.answers[i]===k){cls+=' bad'; tag='<span class="tag">إجابتك</span>';}
    }
    const checked = S.answers[i]===k;
    h += `<button type="button" class="${cls}" data-k="${k}" ${review?'disabled':`role="radio" aria-checked="${checked}"`}>
      <span class="ltr">${LET[k]}</span><span class="txt">${body}</span>${tag}</button>`;
  }
  return h + '</div>';
}
function mapHTML(review){
  let h='';
  Q.forEach((q,i)=>{
    let c='';
    if(review){ c = S.answers[i]===undefined ? 'skip' : (S.answers[i]===q.a ? 'ok' : 'bad'); }
    else { if(S.answers[i]!==undefined) c+=' ans'; if(S.flags[i]) c+=' flg'; }
    if(i===S.cur) c+=' cur';
    h += `<button type="button" class="${c}" data-go="${i}" aria-label="السؤال ${i+1}">${ar(i+1)}</button>`;
  });
  return h;
}
function renderExam(){
  const review = S.phase==='review';
  const q = Q[S.cur], i = S.cur;
  let verdict='';
  if(review){
    const a=S.answers[i];
    verdict = a===undefined ? '<div class="verdict skip">لم تجب عن هذا السؤال.</div>'
      : a===q.a ? '<div class="verdict ok">إجابتك صحيحة.</div>'
      : `<div class="verdict bad">إجابتك غير صحيحة. الإجابة الصحيحة: ${LET[q.a]}</div>`;
  }
  $app.innerHTML = `
  <header class="bar"><div class="bar-in">
    <div class="bar-title">${review?'مراجعة الإجابات':'اختبار العلوم والفيزياء المتكامل'}</div>
    ${review ? `<span class="prog">الدرجة: ${ar(score())} / ${ar(40)}</span><button class="btn" id="toResult">النتيجة</button>`
      : `<span class="prog" id="prog"></span><div class="timer" id="timer" role="timer" aria-label="الوقت المتبقي">--:--:--</div><button class="btn primary" id="submit">تسليم الامتحان</button>`}
    </div><div class="meter"><i id="meter"></i></div></header>
  <div class="layout">
    <main class="card" id="qcard">
      <div class="q-head">
        <div class="q-no">السؤال ${ar(i+1)} <small>من ${ar(Q.length)}</small></div>
        ${review?'':`<button class="flagbtn" id="flag" aria-pressed="${!!S.flags[i]}">${S.flags[i]?'⚑ معلّم للمراجعة':'⚐ علّم للمراجعة'}</button>`}
      </div>
      <div class="q-body"><p class="q-text">${q.t}</p>${figHTML(q)}</div>
      ${optsHTML(q,i,review)}
      ${verdict}
      <div class="q-foot">
        <div class="grp">
          <button class="btn" id="prev" ${i===0?'disabled':''}>→ السابق</button>
          <button class="btn primary" id="next" ${i===Q.length-1?'disabled':''}>التالي ←</button>
        </div>
        ${review?'':`<button class="clear" id="clear" ${S.answers[i]===undefined?'hidden':''}>مسح الإجابة</button>`}
      </div>
    </main>
    <aside class="card side">
      <h2>خريطة الأسئلة</h2>
      <div class="map" id="map">${mapHTML(review)}</div>
      <div class="legend">${review
        ? '<span><i class="o"></i>إجابة صحيحة</span><span><i class="b"></i>إجابة خاطئة</span><span><i class="s"></i>بلا إجابة</span>'
        : '<span><i class="a"></i>تمت الإجابة</span><span><i></i>لم تتم الإجابة</span><span><i class="f"></i>معلّم للمراجعة</span>'}</div>
    </aside>
  </div>`;
  bindExam(review);
  updateBar();
}
function go(n){ S.cur = Math.max(0,Math.min(Q.length-1,n)); save(); renderExam(); window.scrollTo({top:0}); }
function bindExam(review){
  document.getElementById('map').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go); });
  document.getElementById('prev').onclick=()=>go(S.cur-1);
  document.getElementById('next').onclick=()=>go(S.cur+1);
  if(review){ document.getElementById('toResult').onclick=()=>{ S.phase='done'; save(); renderResult(); }; return; }
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ S.answers[S.cur]=+b.dataset.k; save(); renderExam(); });
  document.getElementById('flag').onclick=()=>{ if(S.flags[S.cur]) delete S.flags[S.cur]; else S.flags[S.cur]=1; save(); renderExam(); };
  document.getElementById('clear').onclick=()=>{ delete S.answers[S.cur]; save(); renderExam(); };
  document.getElementById('submit').onclick=openConfirm;
}
function updateBar(){
  const meter=document.getElementById('meter'), prog=document.getElementById('prog');
  if(S.phase==='review'){ if(meter) meter.style.width=(S.cur+1)/Q.length*100+'%'; return; }
  if(prog) prog.textContent = `أجبت عن ${ar(answered())} من ${ar(Q.length)}`;
  if(meter) meter.style.width = answered()/Q.length*100+'%';
  const t=document.getElementById('timer'); if(!t) return;
  const left=Math.round((S.endAt-Date.now())/1000);
  t.textContent=fmt(left); t.classList.toggle('low', left<=600);
}
function startTick(){
  clearInterval(tick);
  tick=setInterval(()=>{
    if(S.phase!=='exam') return;
    if(S.endAt-Date.now()<=0){ finish(true); return; }
    const t=document.getElementById('timer');
    if(t){ const left=Math.round((S.endAt-Date.now())/1000); t.textContent=fmt(left); t.classList.toggle('low', left<=600); }
  },1000);
}

/* ---------- confirm & finish ---------- */
function openConfirm(){
  const un=Q.length-answered(), fl=Object.keys(S.flags).length;
  const v=document.createElement('div'); v.className='veil'; v.id='veil';
  v.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">تسليم الامتحان؟</h2>
    <ul><li>أجبت عن ${ar(answered())} من ${ar(Q.length)} سؤالاً.</li>
    ${un?`<li><b>${ar(un)}</b> سؤالاً بلا إجابة.</li>`:''}
    ${fl?`<li><b>${ar(fl)}</b> سؤالاً معلّماً للمراجعة.</li>`:''}</ul>
    <div>لا يمكنك تعديل إجاباتك بعد التسليم.</div>
    <div class="row"><button class="btn" id="back">العودة للامتحان</button><button class="btn primary" id="yes">تسليم الآن</button></div></div>`;
  document.body.appendChild(v);
  document.getElementById('back').onclick=()=>v.remove();
  document.getElementById('yes').onclick=()=>{ v.remove(); finish(false); };
  document.getElementById('back').focus();
}
function finish(auto){
  S.phase='done'; S.submittedAt=Date.now(); S.auto=!!auto; save(); clearInterval(tick); renderResult();
}
function grade(s){ return s>=36?'ممتاز':s>=32?'جيد جداً':s>=28?'جيد':s>=24?'مقبول':'يحتاج إلى مراجعة'; }
function renderResult(){
  const s=score(), un=Q.length-answered(), wrong=answered()-s;
  const used=Math.min(SECONDS,Math.round(((S.submittedAt||Date.now())-S.startAt)/1000));
  $app.innerHTML=`<section class="result"><div class="sheet">
    <div class="sheet-head"><div class="ministry">نتيجة الامتحان${S.auto?' · انتهى الوقت وسُلّم تلقائياً':''}</div>
      <h1>${esc(S.name)}</h1>${S.sec?`<div class="who">الشعبة: ${esc(S.sec)}</div>`:''}</div>
    <div class="score"><div class="big">${ar(s)}<small> / ${ar(40)}</small></div>
      <div class="grade">${grade(s)} · ${ar(Math.round(s/Q.length*100))}٪</div></div>
    <div class="split"><div class="g"><b>${ar(s)}</b><span>صحيحة</span></div><div class="r"><b>${ar(wrong)}</b><span>خاطئة</span></div><div class="y"><b>${ar(un)}</b><span>بلا إجابة</span></div></div>
    <div class="split"><div><b dir="ltr">${fmt(used)}</b><span>الزمن المستغرق</span></div><div><b>${ar(Q.length)}</b><span>عدد الأسئلة</span></div><div><b>${ar(40)}</b><span>الدرجة الكلية</span></div></div>
    <div class="res-actions"><button class="btn primary big" id="rev">مراجعة الإجابات</button><button class="btn big" id="again">امتحان جديد</button></div>
  </div></section>`;
  document.getElementById('rev').onclick=()=>{ S.phase='review'; S.cur=0; save(); renderExam(); window.scrollTo({top:0}); };
  document.getElementById('again').onclick=()=>{ S={phase:'start',name:S.name,sec:S.sec,startAt:0,endAt:0,answers:{},flags:{},cur:0,submittedAt:0}; save(); renderStart(); };
}

document.addEventListener('keydown',e=>{
  if(S.phase!=='exam' && S.phase!=='review') return;
  if(e.target.tagName==='INPUT' || document.getElementById('veil')) return;
  if(e.key==='ArrowLeft') go(S.cur+1);
  else if(e.key==='ArrowRight') go(S.cur-1);
  else if(S.phase==='exam' && /^[1-4]$/.test(e.key)){ S.answers[S.cur]=+e.key-1; save(); renderExam(); }
});

/* ---------- boot ---------- */
load();
if(S.phase==='exam'){
  if(S.endAt-Date.now()<=0){ finish(true); } else { renderExam(); startTick(); }
} else if(S.phase==='done'){ renderResult(); }
else if(S.phase==='review'){ renderExam(); }
else renderStart();
</script>

</body></html>
